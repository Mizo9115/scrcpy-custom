name: Windows Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-auto-release
  cancel-in-progress: true

jobs:
  build-and-release-win64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build server APK
        shell: pwsh
        run: .\gradlew.bat -p server assembleRelease

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libusb

      - name: Build Windows client
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          meson setup build --buildtype=release \
            -Dportable=true \
            -Dprebuilt_server=server/build/outputs/apk/release/server-release-unsigned.apk
          ninja -C build

      - name: Compute artifact name
        id: meta
        shell: pwsh
        run: |
          $short = "${env:GITHUB_SHA}".Substring(0, 7)
          "short_sha=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Collect portable files
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp build/app/scrcpy.exe dist/
          cp build/server/scrcpy-server dist/
          cp app/data/scrcpy-console.bat dist/
          cp app/data/open_a_terminal_here.bat dist/
          cp app/data/scrcpy-noconsole.vbs dist/
          for f in $(ldd build/app/scrcpy.exe | awk '/\/mingw64\/bin\//{print $3}'); do
            cp "$f" dist/
          done
          printf "Built from commit %s\n" "$GITHUB_SHA" > dist/BUILD_INFO.txt

      - name: Package portable zip
        shell: pwsh
        run: |
          $zipName = "scrcpy-win64-custom-${{ steps.meta.outputs.short_sha }}.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path dist\* -DestinationPath $zipName
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: pkg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.zip_name }}
          path: ${{ steps.pkg.outputs.zip_name }}

      - name: Publish/update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (main)
          make_latest: false
          prerelease: true
          files: ${{ steps.pkg.outputs.zip_name }}
